[package]
name = "rust-winui-mpv"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
windows-reactor = "0.100"
# Runtime for the Win32 bindings in src/bindings.rs; the same version
# windows-reactor uses, so it isn't compiled twice.
windows-core = "0.100"
libmpv2 = "7.0"

[build-dependencies]
embed-resource = "3.0"

