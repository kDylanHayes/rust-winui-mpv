[package]
name = "rust-winui-mpv"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
windows-reactor = "0.100"
libmpv2 = "7.0"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]
